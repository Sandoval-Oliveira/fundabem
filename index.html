<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferramentas Fundabem</title>
<style>
:root{--coral:#FF522B;--laranja:#FF8600;--ambar:#FEAD00;--teal:#039791;--roxo:#8F5795;--petroleo:#0E6175;--creme:#FDFAD3}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:var(--creme);color:#23323a;min-height:100vh;overflow-x:hidden;position:relative}
.c{position:fixed;border-radius:50%;z-index:0}
.c1{width:260px;height:260px;background:var(--teal);top:-130px;left:-130px}
.c2{width:240px;height:240px;background:var(--roxo);top:-120px;right:-120px}
.c3{width:240px;height:240px;background:var(--ambar);bottom:-120px;left:-120px}
.c4{width:260px;height:260px;background:var(--coral);bottom:-130px;right:-130px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:48px 16px}
h1{text-align:center;color:var(--petroleo);font-weight:900;margin:0}
p.sub{text-align:center;color:var(--petroleo);font-weight:700;text-transform:uppercase;font-size:.85rem;margin:6px 0 32px}
a.card{display:block;background:#fff;border:2px solid #e6dfa8;border-left:8px solid var(--laranja);border-radius:18px;padding:18px 20px;margin-bottom:14px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(14,97,117,.12)}
a.card:hover{border-color:var(--laranja)}
a.card b{color:var(--petroleo);font-size:1.1rem}
a.card span{display:block;margin-top:4px;font-size:.92rem}
</style>
</head>
<body>
<div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div>
<main>
<h1>Ferramentas Fundabem</h1>
<p class="sub">Fundação Pato-branquense do Bem-Estar</p>
<a class="card" href="orcamento/"><b>Gerador de orçamento</b><span>Pesquisa de preço no modelo padrão da Fundabem, em PDF.</span></a>
</main>
</body>
</html>
